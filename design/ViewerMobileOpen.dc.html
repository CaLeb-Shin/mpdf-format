<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0e0f13; color: #f2efe9; font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #ff7a1a; text-decoration: none; } a:hover { color: #ffa35c; }
    .display { font-family: "Gothic A1", "Apple SD Gothic Neo", sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .staff { height: 28px; background: repeating-linear-gradient(to bottom, #0e0f13 0 1px, transparent 1px 7px); }
    h1, h2, h3, p { margin: 0; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #34363d; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #0e0f13; border-bottom: 1px solid #2c2f38; flex-shrink: 0;">
    <div class="display" style="font-size: 18px; letter-spacing: .02em;">MPDF</div>
    <div style="font-size: 14px; font-weight: 700; flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">피아노 교재 2권</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9d4cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="m6 10 6 6 6-6"/><path d="M4 20h16"/></svg>
    <span style="padding: 7px 12px; background: #ff7a1a; color: #0e0f13; border-radius: 999px; font-size: 12px; font-weight: 700;">나도 만들기</span>
  </div>
  <div style="height: 62px; display: flex; align-items: center; justify-content: center; background: #0e0f13; border-bottom: 1px solid #2c2f38; flex-shrink: 0;">
    <div style="width: 320px; height: 50px; border: 1px dashed #4a4e59; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #6f6a62;"><span class="mono" style="font-size: 11px;">광고 320×50</span></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0 0 0; overflow: hidden;">
    <div style="width: 370px; background: #f7f3ea; color: #0e0f13; padding: 26px 26px 20px 26px; display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 18px; font-weight: 700;">1. 캐논</div>
      <div class="staff"></div><div class="staff"></div><div class="staff"></div><div class="staff"></div><div class="staff"></div><div class="staff"></div>
    </div>
  </div>

  <!-- scrim only while the sheet is open; a tap closes it -->
  <div style="position: absolute; left: 0; right: 0; top: 114px; bottom: 0; background: rgba(0,0,0,.45);"></div>

  <!-- expanded player sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1a1c22; border-top: 1px solid #2c2f38; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.9);">
    <div style="display: flex; align-items: center; justify-content: center; padding: 10px 0 6px 0;"><span style="width: 40px; height: 4px; border-radius: 999px; background: #4a4e59;"></span></div>
    <div style="margin: 0 16px; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 10px; overflow: hidden;">
      <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: linear-gradient(135deg, #2a2622, #4a3a33);"></div>
      <svg width="56" height="40" viewBox="0 0 56 40" style="position: relative;"><rect width="56" height="40" rx="10" fill="#e0301e"/><path d="M22 12v16l14-8z" fill="#fff"/></svg>
      <span class="mono" style="position: absolute; left: 12px; top: 10px; font-size: 10px; color: rgba(242,239,233,.6);">유튜브 공식 플레이어 · 유튜브 트랙일 때만</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 10px 20px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 10px; height: 10px; border-radius: 999px; background: #ff7a1a;"></span>
        <span style="font-size: 16px; font-weight: 700; flex-grow: 1;">캐논</span>
        <span class="mono" style="font-size: 12px; color: #8a857c;">p.1–2 · 1:24 / 4:10</span>
      </div>
      <div style="height: 4px; background: #2c2f38; border-radius: 999px; position: relative;"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #ff7a1a; border-radius: 999px;"></div></div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 28px; padding-top: 4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#d9d4cb"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        <span style="width: 52px; height: 52px; border-radius: 999px; background: #ff7a1a; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0e0f13"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#d9d4cb"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; border-top: 1px solid #2c2f38;">
      <div style="display: grid; grid-template-columns: 14px 44px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 12px 20px; background: rgba(255,122,26,.12);">
        <span style="width: 10px; height: 10px; border-radius: 999px; background: #ff7a1a;"></span><span class="mono" style="font-size: 12px; color: #ff7a1a;">1–2</span><span style="font-size: 14px; font-weight: 700;">캐논</span><span class="mono" style="font-size: 11px; color: #8a857c; text-align: right;">4:10</span>
      </div>
      <div style="display: grid; grid-template-columns: 14px 44px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid #2c2f38;">
        <span style="width: 10px; height: 10px; border-radius: 999px; background: #2fc4b2;"></span><span class="mono" style="font-size: 12px; color: #b9b4ab;">3</span><span style="font-size: 14px;">아리랑 <span class="mono" style="font-size: 11px; color: #8a857c;">0:32부터</span></span><span class="mono" style="font-size: 11px; color: #8a857c; text-align: right;">3:48</span>
      </div>
      <div style="display: grid; grid-template-columns: 14px 44px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid #2c2f38;">
        <span style="width: 10px; height: 10px; border-radius: 999px; background: #b48cff;"></span><span class="mono" style="font-size: 12px; color: #b9b4ab;">4</span><span style="font-size: 14px;">엘리제를 위하여</span><span class="mono" style="font-size: 11px; color: #8a857c; text-align: right;">5:02</span>
      </div>
    </div>
    <div style="margin: 12px 16px 16px 16px; height: 80px; border: 1px dashed #4a4e59; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6f6a62;"><span class="mono" style="font-size: 11px;">광고 320×80 · 시트 안</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
